# Production (Render) — PostgreSQL.
# Render's render.yaml injects DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD
# from the linked Postgres add-on; we build the JDBC URL from those.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# CORS — set CORS_ALLOWED_ORIGINS in Render to your Firebase Hosting URL(s),
# comma-separated, e.g. https://my-reunion.web.app,https://my-reunion.firebaseapp.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
