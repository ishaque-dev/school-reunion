# Default profile is "dev" (H2 in-memory). Render sets SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8080}
spring.application.name=school-reunion-backend

# JPA defaults shared by all profiles
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Allow larger payloads (for photo URLs / future uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.com.reunion=INFO
